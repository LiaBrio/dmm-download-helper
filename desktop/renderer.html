<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src *; img-src * data:;">
  <title>DMM Download Helper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #1a1a1a;
      --surface: #242424;
      --surface2: #2e2e2e;
      --border: #3a3a3a;
      --text: #e8e8e8;
      --text2: #999;
      --accent: #4a9eff;
      --green: #34c759;
      --red: #ff453a;
      --orange: #ff9f0a;
      --radius: 8px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 13px;
    }

    /* Layout */
    .app-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    .browser-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
    }
    .side-panel {
      width: 380px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Navigation bar */
    .nav-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
    }
    .nav-bar input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 10px;
      color: var(--text);
      font-size: 12px;
      -webkit-app-region: no-drag;
    }
    .nav-bar input:focus { outline: none; border-color: var(--accent); }
    .nav-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      padding: 4px 10px;
      cursor: pointer;
      font-size: 12px;
      -webkit-app-region: no-drag;
    }
    .nav-btn:hover { background: var(--border); }

    /* Webview */
    .browser-panel webview {
      flex: 1;
      border: none;
    }

    /* Side panel sections */
    .panel-header {
      padding: 10px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-weight: 600;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sessions-section, .tasks-section {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .tasks-section { border-top: 1px solid var(--border); }

    /* Session cards */
    .session-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      margin-bottom: 8px;
    }
    .session-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .session-badge {
      font-size: 11px;
      background: var(--accent);
      color: #fff;
      padding: 2px 6px;
      border-radius: 3px;
    }
    .session-time { font-size: 11px; color: var(--text2); }
    .session-mpd {
      font-size: 11px;
      color: var(--text2);
      word-break: break-all;
      margin-bottom: 6px;
      max-height: 32px;
      overflow: hidden;
    }
    .session-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn {
      padding: 4px 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface2);
      color: var(--text);
      cursor: pointer;
      font-size: 11px;
      transition: all .15s;
    }
    .btn:hover { background: var(--border); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn-primary:hover { opacity: 0.85; }
    .btn-green { background: var(--green); border-color: var(--green); color: #fff; }

    /* Task cards */
    .task-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      margin-bottom: 8px;
    }
    .task-name {
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .task-status {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 3px;
      text-transform: uppercase;
    }
    .task-status.running { background: var(--accent); color: #fff; }
    .task-status.done { background: var(--green); color: #fff; }
    .task-status.failed { background: var(--red); color: #fff; }
    .task-status.cancelled { background: var(--text2); color: #fff; }
    .task-status.converting { background: var(--orange); color: #fff; }
    .task-status.queued { background: var(--surface2); color: var(--text2); }
    .task-progress {
      height: 3px;
      background: var(--surface2);
      border-radius: 2px;
      margin: 6px 0;
      overflow: hidden;
    }
    .task-progress-bar {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width .3s;
    }
    .task-error {
      font-size: 11px;
      color: var(--red);
      margin-top: 4px;
    }
    .task-actions { margin-top: 6px; }

    /* Empty state */
    .empty { text-align: center; color: var(--text2); padding: 20px; font-size: 12px; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>
  <div class="app-layout">
    <!-- Browser Panel -->
    <div class="browser-panel">
      <div class="nav-bar">
        <button class="nav-btn" id="btnBack">&larr;</button>
        <button class="nav-btn" id="btnForward">&rarr;</button>
        <button class="nav-btn" id="btnReload">&#8635;</button>
        <input type="text" id="urlBar" placeholder="https://www.dmm.co.jp/" value="https://www.dmm.co.jp/digital/">
        <button class="nav-btn" id="btnGo">Go</button>
      </div>
      <webview
        id="webview"
        src="https://www.dmm.co.jp/digital/"
        partition="persist:dmm-helper-browser"
        allowpopups
        style="flex:1;"
      ></webview>
    </div>

    <!-- Side Panel -->
    <div class="side-panel">
      <div class="panel-header">
        <span>Captured Sessions</span>
        <button class="btn" id="btnClearSessions">Clear</button>
      </div>
      <div class="sessions-section" id="sessionsList">
        <div class="empty">Play a video on DMM to capture MPD + Keys</div>
      </div>

      <div class="panel-header">
        <span>Downloads</span>
        <button class="btn" id="btnRefreshTasks">Refresh</button>
      </div>
      <div class="tasks-section" id="tasksList">
        <div class="empty">No download tasks</div>
      </div>
    </div>
  </div>

  <script>
    const webview = document.getElementById('webview');
    const urlBar = document.getElementById('urlBar');
    const sessionsList = document.getElementById('sessionsList');
    const tasksList = document.getElementById('tasksList');

    // Set webview preload path dynamically (requires absolute file:// path)
    webview.setAttribute('preload', window.desktopApi.getWebviewPreloadPath());

    let capturedSessions = [];
    let tasks = [];
    let autoDownloadedSet = new Set(); // Track auto-downloaded sessions to avoid duplicates

    // ─── Navigation ────────────────────────────────────────────────────────
    document.getElementById('btnBack').onclick = () => { if (webview.canGoBack()) webview.goBack(); };
    document.getElementById('btnForward').onclick = () => { if (webview.canGoForward()) webview.goForward(); };
    document.getElementById('btnReload').onclick = () => webview.reload();
    document.getElementById('btnGo').onclick = () => navigateTo(urlBar.value);
    urlBar.addEventListener('keydown', (e) => { if (e.key === 'Enter') navigateTo(urlBar.value); });

    function navigateTo(url) {
      if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'https://' + url;
      webview.loadURL(url);
    }

    webview.addEventListener('did-navigate', (e) => { urlBar.value = e.url; });
    webview.addEventListener('did-navigate-in-page', (e) => { if (e.isMainFrame) urlBar.value = e.url; });

    // ─── Handle popup windows (DMM player opens in new window) ─────────────
    webview.addEventListener('new-window', (e) => {
      e.preventDefault();
      console.log('[renderer] Popup requested:', e.url);
      window.desktopApi.openPopup(e.url);
    });

    // ─── Sessions from webview ─────────────────────────────────────────────
    webview.addEventListener('ipc-message', (event) => {
      if (event.channel === 'dmm:sessions') {
        const sessions = event.args[0];
        if (Array.isArray(sessions) && sessions.length > 0) {
          capturedSessions = sessions;
          renderSessions();
          tryAutoDownload();
        }
      }
    });

    // ─── Sessions from popup windows ───────────────────────────────────────
    window.desktopApi.onPopupSessions((sessions) => {
      if (Array.isArray(sessions) && sessions.length > 0) {
        capturedSessions = sessions;
        renderSessions();
        tryAutoDownload();
      }
    });

    document.getElementById('btnClearSessions').onclick = () => {
      capturedSessions = [];
      renderSessions();
    };

    function renderSessions() {
      if (capturedSessions.length === 0) {
        sessionsList.innerHTML = '<div class="empty">Play a video on DMM to capture MPD + Keys</div>';
        return;
      }
      sessionsList.innerHTML = capturedSessions.map((s, i) => {
        const hasKeys = s.keys && s.keys.length > 0;
        const hasMpd = Boolean(s.mpd || s.fullMpd);
        const canDownload = hasKeys && hasMpd;
        return `
          <div class="session-card">
            <div class="session-header">
              <span class="session-badge">#${s.id} ${s.quality || 'Auto'}</span>
              <span class="session-time">${s.time || ''}</span>
            </div>
            <div class="session-mpd">${s.mpd || '(waiting for MPD...)'}</div>
            <div class="session-actions">
              ${canDownload ? `<button class="btn btn-primary" onclick="submitDownload(${i})">Download</button>` : ''}
              ${hasMpd ? `<button class="btn" onclick="copyText('${escapeHtml(s.fullMpd || s.mpd || '')}')">Copy MPD</button>` : ''}
              ${hasKeys ? `<button class="btn" onclick="copyKeys(${i})">Copy Keys</button>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    async function copyText(text) {
      try { await navigator.clipboard.writeText(text); } catch(_) {}
    }

    async function copyKeys(idx) {
      const s = capturedSessions[idx];
      if (!s || !s.keys) return;
      const keyArgs = s.keys.map(k => '--key ' + k.kid + ':' + k.k32).join(' ');
      await copyText(keyArgs);
    }

    async function submitDownload(idx) {
      const s = capturedSessions[idx];
      if (!s) return;
      const url = s.fullMpd || s.mpd;
      if (!url) return;

      const result = await window.desktopApi.submitDownload({
        url,
        keys: s.keys || [],
      });
      if (result.ok) {
        refreshTasks();
      } else {
        alert('Failed to submit: ' + (result.error || 'unknown'));
      }
    }

    // Auto-download when a complete session (MPD + Keys) is detected
    function tryAutoDownload() {
      let triggered = false;
      for (const s of capturedSessions) {
        const hasMpd = Boolean(s.mpd || s.fullMpd);
        const hasKeys = s.keys && s.keys.length > 0;
        if (!hasMpd || !hasKeys) continue;

        // Use MPD URL as dedup key
        const dedupKey = s.fullMpd || s.mpd;
        if (autoDownloadedSet.has(dedupKey)) continue;

        autoDownloadedSet.add(dedupKey);
        triggered = true;
        window.desktopApi.submitDownload({
          url: s.fullMpd || s.mpd,
          keys: s.keys,
        }).then((result) => {
          if (result.ok) refreshTasks();
        });
      }
      // Close popup windows once download has been submitted
      if (triggered && window.desktopApi.closePopups) {
        window.desktopApi.closePopups();
      }
    }

    // ─── Tasks ─────────────────────────────────────────────────────────────
    document.getElementById('btnRefreshTasks').onclick = refreshTasks;

    async function refreshTasks() {
      tasks = await window.desktopApi.listTasks();
      renderTasks();
    }

    // Listen for real-time task updates
    window.desktopApi.onTaskUpdated((data) => {
      const idx = tasks.findIndex(t => t.id === data.id);
      if (idx >= 0) tasks[idx] = data;
      else tasks.unshift(data);
      renderTasks();
    });

    function renderTasks() {
      if (tasks.length === 0) {
        tasksList.innerHTML = '<div class="empty">No download tasks</div>';
        return;
      }
      tasksList.innerHTML = tasks.map(t => {
        const showProgress = t.status === 'running' || t.status === 'converting';
        return `
          <div class="task-card">
            <div class="task-name">
              <span>${t.saveName}</span>
              <span class="task-status ${t.status}">${t.status}</span>
            </div>
            ${showProgress ? `
              <div class="task-progress">
                <div class="task-progress-bar" style="width:${t.progress}%"></div>
              </div>
            ` : ''}
            ${t.error ? `<div class="task-error">${t.error}</div>` : ''}
            <div class="task-actions">
              ${t.status === 'running' ? `<button class="btn" onclick="cancelTask('${t.id}')">Cancel</button>` : ''}
              ${t.status === 'done' ? `<button class="btn btn-green" onclick="openFile('${escapeHtml(t.downloadDir)}')">Open Folder</button>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    async function cancelTask(id) {
      await window.desktopApi.cancelTask(id);
      refreshTasks();
    }

    function openFile(dir) {
      window.desktopApi.openPath(dir);
    }

    // Initial load
    refreshTasks();
  </script>
</body>
</html>
